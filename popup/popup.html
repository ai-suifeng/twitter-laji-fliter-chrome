<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Twitter 评论净化 <span class="sub">Jev</span></h1>
      <button id="btn-settings" class="icon" title="设置">⚙</button>
    </header>

    <section id="main">
      <label class="toggle">
        <input id="chk-enabled" type="checkbox" />
        启用实时屏蔽（仅推文详情页的回复）
      </label>
      <p class="stat">已屏蔽 <b id="blocked-count">0</b> 条</p>
      <p class="hint">
        打开任意推文详情页，回复会自动判断；命中的回复被替换为「🚫 已屏蔽」，点击可查看原文。
      </p>
    </section>

    <section id="settings" class="hidden">
      <label>
        服务商
        <select id="sel-provider">
          <option value="typesafe">TypeSafe 官方（api.typesafe.ai）</option>
          <option value="openrouter">OpenRouter（~typesafe/jev-latest）</option>
        </select>
      </label>
      <label>
        API key
        <div class="row">
          <input id="inp-key" type="text" placeholder="sk-..." autocomplete="off" />
          <button id="btn-save">保存</button>
        </div>
      </label>
      <p id="key-invalid" class="error hidden">
        ⚠ 上次判断收到 401：服务商拒绝了当前保存的 key。换 key 保存后自动恢复。
      </p>
      <button id="btn-test" class="primary">测试连接（用输入框里的 key）</button>
      <p id="test-result" class="test-result hidden"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
